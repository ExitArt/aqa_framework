version: '3.8'

services:
  kafka:
    # Официальный чистый образ Apache Kafka (KRaft режим)
    image: apache/kafka:3.7.0
    container_name: kafka_broker
    ports:
      - "9092:9092"   # Пробрасываем порт на вашу Windows для Offset Explorer и Java
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    # ИСПРАВЛЕНО: Никакого хардкода. Docker сам возьмет значения из файла .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  wiremock:
    image: wiremock/wiremock:3.9.1-alpine
    container_name: wiremock_server
    ports:
      - "8080:8080" # Открываем порт 8080. Теперь ты СМОЖЕШЬ зайти в браузере на http://localhost:8080/__admin
    volumes:
      - ./wiremock:/home/wiremock # Папка wiremock создастся у тебя в проекте для хранения JSON-заглушек