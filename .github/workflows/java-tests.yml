name: Java Playwright UI Tests (SauceDemo)
on:
  push:
  # Пайплайн запускается при пуше в вообще любую ветку
  pull_request:
  # Пайплайн проверяет пулл-реквесты из любых веток
  workflow_dispatch:
    # Кнопка ручного запуска в интерфейсе GitHub доступна всегда
    inputs:
      browser:
        description: 'Выберите браузер'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox

      headless:
        description: 'Запустить в скрытом режиме (Headless)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      test_tags:
        description: 'Фильтр тестов (Имя класса или паттерн. Пусто = ВСЕ. Примеры: LoginTest, *Smoke*)'
        required: false
        default: ''
        type: string

      username:
        description: 'Имя пользователя (Login)'
        required: true
        default: 'standard_user'
        type: choice
        options:
          - 'standard_user'
          - 'locked_out_user'
          - 'problem_user'
          - 'performance_glitch_user'
          - 'error_user'
          - 'visual_user'

      password:
        description: 'Пароль (Password)'
        required: true
        default: 'secret_sauce'
        type: password

permissions:
  checks: write
  contents: write # Нужен доступ для записи отчетов на gh-pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest

    # ПОЧИНЕНО: Поднимаем чистую официальную Kafka 3.7.0 (KRaft) в контейнере GitHub Actions
    services:
      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'oracle'
          cache: 'maven'

      - name: Build Project and Download Dependencies
        run: mvn test-compile -B -ntp

      - name: Install Playwright Browsers
        run: mvn exec:java -q -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

      - name: Install Playwright Operating System Dependencies
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install-deps"

      # ПОЧИНЕНО: Даем облачной Кафке 3 секунды, чтобы полностью инициализировать метаданные и порты
      - name: Wait for Kafka to be ready
        run: sleep 3

      - name: Run Tests with Maven
        run: |
          mvn test -B -ntp \
          -Dchosen.browser="${{ github.event.inputs.browser || 'chromium' }}" \
          -Dchosen.headless="${{ github.event.inputs.headless || 'true' }}" \
          -Dtest.username="${{ github.event.inputs.username || 'standard_user' }}" \
          -Dtest.password="${{ github.event.inputs.password || 'secret_sauce' }}" \
          ${{ github.event.inputs.test_tags != '' && format('-Dtest="{0}"', github.event.inputs.test_tags) || '' }}

      # Сохраняем логи и сырые результаты тестов в артефакты GitHub ВСЕГДА
      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          retention-days: 5

      - name: Publish Test Report Summary
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      # --- НИЖЕ ЛОГИКА ОГРАНИЧЕНИЯ ДЛЯ ВЕТКИ MAIN ---

      # Скачиваем историю прошлых запусков ТОЛЬКО для main branch
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        with:
          ref: gh-pages
          path: target/allure-results/history

      # Собираем Allure отчет в готовый сайт ТОЛЬКО для main branch
      - name: Generate Allure Report via Maven
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: mvn allure:report -Dallure.install.dir=${{ github.workspace }}/.allure || true

      # Публикуем сайт на GitHub Pages ТОЛЬКО для main branch
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin