name: Java Playwright UI Tests (SauceDemo)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Выберите браузер'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
      headless:
        description: 'Запустить в скрытом режиме (Headless)?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      test_tags:
        description: 'Фильтр тестов (Имя класса или паттерн. Пусто = ВСЕ. Примеры: LoginTest, *Smoke*)'
        required: false
        default: ''
        type: string
      username:
        description: 'Имя пользователя (Login)'
        required: true
        default: 'standard_user'
        type: choice
        options:
          - 'standard_user'
          - 'locked_out_user'
          - 'problem_user'
          - 'performance_glitch_user'
          - 'error_user'
          - 'visual_user'
      password:
        description: 'Пароль (Password)'
        required: true
        default: 'secret_sauce'
        type: password

permissions:
  checks: write
  contents: write # Нужен доступ для записи отчетов на gh-pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    # Запускаем все шаги внутри готового контейнера Playwright.
    # Внимание: если у вас в pom.xml версия Playwright отличается (например, 1.45.0),
    # замените тег v1.49.0 на вашу версию, чтобы они идеально совпадали.
    container: ://microsoft.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг Set up JDK 23 внутри контейнера больше не нужен — в контейнере Microsoft уже установлена нужная Java!

      - name: Build Project and Download Dependencies
        run: mvn test-compile -B -ntp

      - name: Install Playwright Browsers
        run: mvn exec:java -q -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

      # ЭТАП `install-deps` ПОЛНОСТЬЮ УДАЛЕН, ТАК КАК ВСЕ БИБЛИОТЕКИ УЖЕ ЕСТЬ В КОНТЕЙНЕРЕ

      - name: Run Tests with Maven
        run: |
          mvn test -B -ntp \
          -Dchosen.browser="\${{ github.event.inputs.browser || 'chromium' }}" \
          -Dchosen.headless="\${{ github.event.inputs.headless || 'true' }}" \
          -Dtest.username="\${{ github.event.inputs.username || 'standard_user' }}" \
          -Dtest.password="\${{ github.event.inputs.password || 'secret_sauce' }}" \
          \${{ github.event.inputs.test_tags != '' && format('-Dtest="{0}"', github.event.inputs.test_tags) || '' }}

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          retention-days: 5

      - name: Publish Test Report Summary
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      # --- ЛОГИКА ALLURE ---

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        with:
          ref: gh-pages
          path: allure-history-temp # Скачиваем во временную папку, чтобы Гит не ругался на структуру проекта

      # Переносим историю на нужное место, только если папка скачалась
      - name: Prepare Allure history folder
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          mkdir -p target/allure-results/history
          [ -d "allure-history-temp" ] && cp -r allure-history-temp/* target/allure-results/history/ || echo "No history found"

      - name: Generate Allure Report via Maven
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: mvn allure:report -Dallure.install.dir=\${{ github.workspace }}/.allure || true

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin